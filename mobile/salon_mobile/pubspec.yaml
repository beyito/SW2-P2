name: salon_mobile
description: "Cliente móvil con soporte offline del Salón de Belleza y Asesoramiento IA"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.2
  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0
  http: ^1.2.1
  image: ^4.12.0
  image_picker: ^1.2.4
  path: ^1.9.0
  sqflite: ^2.4.5
  tflite_flutter: ^0.12.1
  uuid: ^4.4.0
  flutter_stripe: ^14.2.0
  printing: ^5.15.1
  pdf: ^3.13.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  archive: ^4.0.0
  crypto: ^3.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  # Los modelos se obtienen con: dart run tool/fetch_models.dart
  assets:
    - assets/models/
