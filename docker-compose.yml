# ====================================================================
# Plataforma Inteligente Salón de Belleza - Entorno completo
# Infraestructura: PostgreSQL, MongoDB, DynamoDB Local, RabbitMQ,
#                  Keycloak y n8n
# Inicialización:  db-migrate, mongo-init y dynamodb-init (una sola vez)
# Backend:         ms-gestion, ms-asesoria, ms-crm, ms-ia, mcp-server y saga-orchestrator
# Pagos:           stripe-cli reenvía los webhooks de Stripe al orquestador
# ====================================================================

x-auth-env: &auth-env
  # Variables compartidas para validar tokens de Keycloak y sesiones activas
  KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/salon
  KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/salon/protocol/openid-connect/certs
  KEYCLOAK_AUDIENCE: salon-api
  DYNAMODB_ENDPOINT: http://dynamodb-local:8000
  ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003

x-crm-env: &crm-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: base64:c2Fsb24tY3JtLWNsYXZlLWxvY2FsLWRlLTMyLWJ5dGVz
  LOG_CHANNEL: stderr
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: salon_crm
  DB_USERNAME: ${POSTGRES_USER:-salon_admin}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-salon_secret_pass}
  # Opcional: clave de la cuenta de servicio de FCM en base64, para enviar notificaciones push
  FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_admin}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_pass}

services:
  # ------------------------------------------------------------------
  # Base de Datos Relacional: PostgreSQL
  # Destino: ms-gestion (Spring Boot) y ms-crm (Laravel)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: salon-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salon_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - salon-network
    healthcheck:
      # Se usa TCP: durante la inicialización solo responde el socket Unix temporal
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-salon_admin} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Base de Datos Documental: MongoDB
  # Destino: ms-asesoria (NestJS) - Asesoría, Clóset Virtual y Comunidad
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: salon-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-salon_asesoria}
    volumes:
      - mongo_data:/data/db
    networks:
      - salon-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Base de Datos NoSQL Llave-Valor: DynamoDB Local
  # Destino: Control de Sesión Única e Idempotencia SAGA (Idempotency-Key)
  # ------------------------------------------------------------------
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: salon-dynamodb-local
    restart: unless-stopped
    user: root
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    networks:
      - salon-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Bus de Mensajería y Eventos: RabbitMQ
  # Destino: Orquestación SAGA, Compensaciones (Rollbacks) y Eventos de Dominio
  # ------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: salon-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"       # Protocolo AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Panel Web de Administración
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_pass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - salon-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Inicialización idempotente (se ejecuta y termina en cada arranque)
  # ------------------------------------------------------------------
  db-migrate:
    image: postgres:16-alpine
    container_name: salon-db-migrate
    restart: "no"
    command: ["sh", "/migrate.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salon_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Usuario de solo lectura de los reportes del Servidor MCP
      REPORTES_PGPASSWORD: ${REPORTES_PGPASSWORD:-salon_reportes_local}
    volumes:
      - ./docker/postgres/migrate.sh:/migrate.sh:ro
      - ./docker/postgres/migrations:/migrations:ro
    networks:
      - salon-network
    depends_on:
      postgres:
        condition: service_healthy

  mongo-init:
    image: mongo:7.0
    container_name: salon-mongo-init
    restart: "no"
    command:
      - mongosh
      - "mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}:${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret_pass}@mongodb:27017/admin"
      - "--quiet"
      - "--file"
      - /init/init-collections.js
    volumes:
      - ./docker/mongodb/init-collections.js:/init/init-collections.js:ro
    networks:
      - salon-network
    depends_on:
      mongodb:
        condition: service_healthy

  dynamodb-init:
    image: python:3.11-alpine
    container_name: salon-dynamodb-init
    restart: "no"
    command: ["python", "/init/init-dynamodb.py"]
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    volumes:
      - ./docker/dynamodb/init-dynamodb.py:/init/init-dynamodb.py:ro
    networks:
      - salon-network
    depends_on:
      dynamodb-local:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Identidad y Acceso: Keycloak (SSO). El realm se configura en la Fase B.
  # ------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: salon-keycloak
    restart: unless-stopped
    # El realm "salon" solo se importa si aún no existe en la base de datos
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak/salon-realm.json:/opt/keycloak/data/import/salon-realm.json:ro
      # Tema de inicio de sesión con la paleta del salón
      - ./docker/keycloak/themes/salon:/opt/keycloak/themes/salon:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_secret_pass}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/salon_keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-salon_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-salon_secret_pass}
      KC_HEALTH_ENABLED: "true"
      # Emisor fijo: el navegador y los servicios deben ver el mismo "iss"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Valores del realm; solo se aplican cuando el realm se importa por primera vez
      SALON_AGENT_SECRET: ${SALON_AGENT_SECRET:-salon-agent-secret-local}
      SALON_BI_SECRET: ${SALON_BI_SECRET:-salon-bi-secret-local}
    networks:
      - salon-network
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      # La imagen no incluye curl; se consulta el puerto de administración con bash
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "\"status\": \"UP\"" <&3'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ------------------------------------------------------------------
  # Automatización omnicanal: n8n. Los flujos se integran en la Fase H.
  # ------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.70.3
    container_name: salon-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    entrypoint: ["sh", "/seed/start.sh"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-clave_local_de_desarrollo_n8n}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${SALON_TIMEZONE:-America/La_Paz}
      RABBIT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_admin}
      RABBIT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_pass}
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/salon/protocol/openid-connect/token
      SALON_AGENT_SECRET: ${SALON_AGENT_SECRET:-salon-agent-secret-local}
      GESTION_GRAPHQL_URL: http://ms-gestion:8081/graphql
      CRM_GRAPHQL_URL: http://ms-crm:8000/graphql
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3000}
      N8N_AUTOMATION_KEY: ${N8N_AUTOMATION_KEY:-clave-local-de-automatizacion}
      # WhatsApp es opcional: sin token, los avisos solo se muestran dentro de la aplicación
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v21.0}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      # Clave secreta de la app de Meta: con ella se comprueba que cada mensaje entrante viene de Meta
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      WHATSAPP_ADMIN_PHONE: ${WHATSAPP_ADMIN_PHONE:-}
      WHATSAPP_TEMPLATE_CONFIRMACION: ${WHATSAPP_TEMPLATE_CONFIRMACION:-}
      WHATSAPP_TEMPLATE_RECORDATORIO: ${WHATSAPP_TEMPLATE_RECORDATORIO:-}
      WHATSAPP_TEMPLATE_STOCK: ${WHATSAPP_TEMPLATE_STOCK:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n:/seed:ro
    # Permite que las pruebas sustituyan a la API de WhatsApp por un servidor local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - salon-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------
  # Microservicio 1: Gestión operativa (Spring Boot + GraphQL)
  # ------------------------------------------------------------------
  ms-gestion:
    build: ./backend/ms-gestion
    container_name: salon-ms-gestion
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/salon_gestion
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-salon_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-salon_secret_pass}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-rabbit_admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_pass}
      # Puerta GraphQL del ERP: servicios a los que reenvía la moderación, el mostrador, el comprobante,
      # la voz y los agentes, con el token de la persona
      ASESORIA_URL: http://ms-asesoria:3100
      SAGA_URL: http://saga-orchestrator:4100
      IA_URL: http://ms-ia:8002/api/v1
      MCP_URL: http://mcp-server:4000/mcp
      CRM_BASE_URL: http://ms-crm:8000
      <<: *auth-env
    networks:
      - salon-network
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      dynamodb-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ------------------------------------------------------------------
  # Microservicio 2: Asesoría, clóset y comunidad (NestJS + REST)
  # ------------------------------------------------------------------
  ms-asesoria:
    build: ./backend/ms-asesoria
    container_name: salon-ms-asesoria
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}:${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret_pass}@mongodb:27017/${MONGO_DATABASE:-salon_asesoria}?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbit_admin}:${RABBITMQ_DEFAULT_PASS:-rabbit_secret_pass}@rabbitmq:5672
      <<: *auth-env
      BIOMETRIC_RETENTION_DAYS: ${BIOMETRIC_RETENTION_DAYS:-365}
    networks:
      - salon-network
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------
  # Microservicio 3: CRM y facturación (Laravel + GraphQL)
  # ------------------------------------------------------------------
  ms-crm:
    build: ./backend/ms-crm
    container_name: salon-ms-crm
    restart: unless-stopped
    ports:
      - "8083:8000"
    environment:
      <<: [*crm-env, *auth-env]
    networks:
      - salon-network
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------
  # Worker del CRM: factura, puntos y reembolsos a partir de los eventos de la SAGA
  # ------------------------------------------------------------------
  ms-crm-worker:
    build: ./backend/ms-crm
    container_name: salon-ms-crm-worker
    restart: unless-stopped
    command: ["php", "artisan", "crm:consume-saga-messages"]
    environment:
      <<: [*crm-env, *auth-env]
    networks:
      - salon-network
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f crm:consume-saga-messages > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Microservicio 4: Inteligencia artificial (FastAPI)
  # ------------------------------------------------------------------
  ms-ia:
    build: ./backend/ms-ia
    container_name: salon-ms-ia
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      <<: *auth-env
      ASESORIA_URL: http://ms-asesoria:3100
      GESTION_GRAPHQL_URL: http://ms-gestion:8081/graphql
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY:-}
      REPLICATE_HAIRCUT_MODEL: ${REPLICATE_HAIRCUT_MODEL:-flux-kontext-apps/change-haircut}
      REPLICATE_TRY_ON_MODEL: ${REPLICATE_TRY_ON_MODEL:-black-forest-labs/flux-2-max}
      IMAGE_GEN_DAILY_LIMIT_PER_CLIENT: ${IMAGE_GEN_DAILY_LIMIT_PER_CLIENT:-5}
      IMAGE_GEN_DAILY_LIMIT_TOTAL: ${IMAGE_GEN_DAILY_LIMIT_TOTAL:-30}
    networks:
      - salon-network
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ------------------------------------------------------------------
  # Servidor MCP para agentes de IA
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Modelo de lenguaje local (Ollama, Qwen 2.5 de 3B): agentes, reportes y textos de marca sin un
  # servicio público de IA. Gemini queda como respaldo. El modelo se descarga una vez al volumen.
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.12.6
    container_name: salon-ollama
    restart: unless-stopped
    entrypoint: ["sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}; wait"]
    environment:
      # El modelo queda cargado en memoria entre preguntas
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - salon-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL:-qwen2.5:3b}'"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 30s

  mcp-server:
    build: ./backend/mcp-server
    container_name: salon-mcp-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SALON_TIMEZONE: ${SALON_TIMEZONE:-America/La_Paz}
      GESTION_GRAPHQL_URL: http://ms-gestion:8081/graphql
      CRM_GRAPHQL_URL: http://ms-crm:8000/graphql
      # IA local primero; Gemini como respaldo
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # Reportes dinámicos: conexiones de solo lectura a cada base (CU-18)
      REPORTES_GESTION_DB_URL: postgres://salon_reportes:${REPORTES_PGPASSWORD:-salon_reportes_local}@postgres:5432/salon_gestion
      REPORTES_CRM_DB_URL: postgres://salon_reportes:${REPORTES_PGPASSWORD:-salon_reportes_local}@postgres:5432/salon_crm
      <<: *auth-env
    networks:
      - salon-network
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------
  # Tablero de inteligencia de negocios en Python (Streamlit): KPI sobre el dataset histórico.
  # Inicia sesión con Keycloak (cliente salon-bi) y exige el rol ADMIN.
  # ------------------------------------------------------------------
  bi-dashboard:
    build: ./backend/bi-dashboard
    container_name: salon-bi-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      BI_URL: http://localhost:8501
      BI_CLIENT_SECRET: ${SALON_BI_SECRET:-salon-bi-secret-local}
      BI_COOKIE_SECRET: ${BI_COOKIE_SECRET:-salon-bi-cookie-local}
      # Desde la red interna, Keycloak publica el inicio de sesión en localhost y el token en keycloak:8080
      BI_KEYCLOAK_METADATA_URL: http://keycloak:8080/realms/salon/.well-known/openid-configuration
    networks:
      - salon-network
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------
  # Orquestador de la SAGA de reserva y pago (CU-10, RF-07, RNF-03, RNF-04)
  # ------------------------------------------------------------------
  saga-orchestrator:
    build: ./backend/saga-orchestrator
    container_name: salon-saga-orchestrator
    restart: unless-stopped
    ports:
      - "4100:4100"
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbit_admin}:${RABBITMQ_DEFAULT_PASS:-rabbit_secret_pass}@rabbitmq:5672
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Defina STRIPE_SECRET_KEY en .env}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?Defina STRIPE_PUBLISHABLE_KEY en .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      <<: *auth-env
    networks:
      - salon-network
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      ms-gestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------
  # Reenvía los webhooks de Stripe al entorno local. La sincronización
  # POST /bookings/{id}/sync cubre el caso en que este servicio no esté disponible.
  # ------------------------------------------------------------------
  stripe-cli:
    image: stripe/stripe-cli:v1.21.8
    container_name: salon-stripe-cli
    restart: unless-stopped
    command:
      - listen
      - --forward-to
      - http://saga-orchestrator:4100/webhooks/stripe
      - --events
      - payment_intent.succeeded,payment_intent.payment_failed
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:?Defina STRIPE_SECRET_KEY en .env}
    networks:
      - salon-network
    depends_on:
      saga-orchestrator:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Microfrontends compilados y servidos con nginx (Module Federation).
  # El navegador los carga desde localhost; para desarrollar con recarga en caliente,
  # detenga el servicio correspondiente (docker compose stop shell) y use npm run dev.
  # ------------------------------------------------------------------
  shell:
    build:
      context: ./frontend
      args:
        APP: shell
        PORT: "3000"
        DIST: dist
    image: salon-shell
    container_name: salon-shell
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - salon-network
    healthcheck:
      # Contenedor principal: React y Module Federation
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mfe-estudio-ia:
    build:
      context: ./frontend
      args:
        APP: mfe-estudio-ia
        PORT: "3001"
        DIST: dist
    image: salon-mfe-estudio-ia
    container_name: salon-mfe-estudio-ia
    restart: unless-stopped
    ports:
      - "3001:3001"
    networks:
      - salon-network
    healthcheck:
      # Remoto React: Estudio IA y Comunidad
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mfe-reservas:
    build:
      context: ./frontend
      args:
        APP: mfe-reservas
        PORT: "3002"
        DIST: dist
    image: salon-mfe-reservas
    container_name: salon-mfe-reservas
    restart: unless-stopped
    ports:
      - "3002:3002"
    networks:
      - salon-network
    healthcheck:
      # Remoto Vue: Reservas y Checkout
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mfe-gestion:
    build:
      context: ./frontend
      args:
        APP: mfe-gestion
        PORT: "3003"
        DIST: dist/browser
    image: salon-mfe-gestion
    container_name: salon-mfe-gestion
    restart: unless-stopped
    ports:
      - "3003:3003"
    networks:
      - salon-network
    healthcheck:
      # Remoto Angular: ERP de gestión
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# --------------------------------------------------------------------
# Redes y Volúmenes Persistentes
# --------------------------------------------------------------------
networks:
  salon-network:
    driver: bridge
    name: salon-network

volumes:
  postgres_data:
    driver: local
    name: salon-postgres-data
  mongo_data:
    driver: local
    name: salon-mongo-data
  dynamodb_data:
    driver: local
    name: salon-dynamodb-data
  rabbitmq_data:
    driver: local
    name: salon-rabbitmq-data
  n8n_data:
    driver: local
    name: salon-n8n-data
  ollama_data:
    driver: local
    name: salon-ollama-data
