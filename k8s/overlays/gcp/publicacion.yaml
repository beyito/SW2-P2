# Entrada HTTPS del tablero de BI en GKE: IP global fija, certificado administrado por Google
# y un BackendConfig para que el balanceador no corte las conexiones WebSocket de Streamlit.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: bi-dashboard
spec:
  domains:
    - BI_DOMINIO
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: bi-dashboard
spec:
  timeoutSec: 3600
  sessionAffinity:
    affinityType: GENERATED_COOKIE
  healthCheck:
    type: HTTP
    requestPath: /_stcore/health
    port: 8501
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bi-dashboard
  annotations:
    kubernetes.io/ingress.global-static-ip-name: salon-bi-ip
    networking.gke.io/managed-certificates: bi-dashboard
    kubernetes.io/ingress.allow-http: "false"
spec:
  defaultBackend:
    service:
      name: bi-dashboard
      port:
        number: 8501
