# Visión artificial y voz: MediaPipe, TFLite y Whisper (FastAPI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-ia
  labels:
    app.kubernetes.io/name: ms-ia
    app.kubernetes.io/part-of: salon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-ia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-ia
        app.kubernetes.io/part-of: salon
    spec:
      containers:
        - name: ms-ia
          # El registro y la etiqueta los fija cada overlay (kustomize images)
          image: salon/ms-ia
          ports:
            - name: http
              containerPort: 8002
          # Configuración y secretos propios del servicio; los crea el despliegue, nunca el repositorio
          envFrom:
            - configMapRef:
                name: ms-ia-config
                optional: true
            - secretRef:
                name: ms-ia-secretos
                optional: true
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 240
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ms-ia
  labels:
    app.kubernetes.io/name: ms-ia
    app.kubernetes.io/part-of: salon
spec:
  selector:
    app.kubernetes.io/name: ms-ia
  ports:
    - name: http
      port: 8002
      targetPort: http
---
# Escala con la carga de CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-ia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-ia
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
