# Asesoría de imagen: clóset, comunidad y consentimientos (NestJS, hexagonal)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-asesoria
  labels:
    app.kubernetes.io/name: ms-asesoria
    app.kubernetes.io/part-of: salon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-asesoria
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-asesoria
        app.kubernetes.io/part-of: salon
    spec:
      containers:
        - name: ms-asesoria
          # El registro y la etiqueta los fija cada overlay (kustomize images)
          image: salon/ms-asesoria
          ports:
            - name: http
              containerPort: 3100
          # Configuración y secretos propios del servicio; los crea el despliegue, nunca el repositorio
          envFrom:
            - configMapRef:
                name: ms-asesoria-config
                optional: true
            - secretRef:
                name: ms-asesoria-secretos
                optional: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "500m", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ms-asesoria
  labels:
    app.kubernetes.io/name: ms-asesoria
    app.kubernetes.io/part-of: salon
spec:
  selector:
    app.kubernetes.io/name: ms-asesoria
  ports:
    - name: http
      port: 3100
      targetPort: http
---
# Escala con la carga de CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-asesoria
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-asesoria
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
