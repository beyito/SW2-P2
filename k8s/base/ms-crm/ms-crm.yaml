# Clientes, facturación y puntos (Laravel, GraphQL, Clean Architecture)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-crm
  labels:
    app.kubernetes.io/name: ms-crm
    app.kubernetes.io/part-of: salon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-crm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-crm
        app.kubernetes.io/part-of: salon
    spec:
      containers:
        - name: ms-crm
          # El registro y la etiqueta los fija cada overlay (kustomize images)
          image: salon/ms-crm
          ports:
            - name: http
              containerPort: 8000
          # Configuración y secretos propios del servicio; los crea el despliegue, nunca el repositorio
          envFrom:
            - configMapRef:
                name: ms-crm-config
                optional: true
            - secretRef:
                name: ms-crm-secretos
                optional: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "500m", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: ms-crm
  labels:
    app.kubernetes.io/name: ms-crm
    app.kubernetes.io/part-of: salon
spec:
  selector:
    app.kubernetes.io/name: ms-crm
  ports:
    - name: http
      port: 8000
      targetPort: http
