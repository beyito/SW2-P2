# Web: gestión del salón (Angular)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe-gestion
  labels:
    app.kubernetes.io/name: mfe-gestion
    app.kubernetes.io/part-of: salon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mfe-gestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mfe-gestion
        app.kubernetes.io/part-of: salon
    spec:
      containers:
        - name: mfe-gestion
          # El registro y la etiqueta los fija cada overlay (kustomize images)
          image: salon/mfe-gestion
          ports:
            - name: http
              containerPort: 3003
          # Configuración y secretos propios del servicio; los crea el despliegue, nunca el repositorio
          envFrom:
            - configMapRef:
                name: mfe-gestion-config
                optional: true
            - secretRef:
                name: mfe-gestion-secretos
                optional: true
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: "200m", memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: mfe-gestion
  labels:
    app.kubernetes.io/name: mfe-gestion
    app.kubernetes.io/part-of: salon
spec:
  selector:
    app.kubernetes.io/name: mfe-gestion
  ports:
    - name: http
      port: 3003
      targetPort: http
