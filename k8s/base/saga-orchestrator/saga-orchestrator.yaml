# Orquestador SAGA de reservas y pagos con Stripe (Node.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator
  labels:
    app.kubernetes.io/name: saga-orchestrator
    app.kubernetes.io/part-of: salon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saga-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saga-orchestrator
        app.kubernetes.io/part-of: salon
    spec:
      containers:
        - name: saga-orchestrator
          # El registro y la etiqueta los fija cada overlay (kustomize images)
          image: salon/saga-orchestrator
          ports:
            - name: http
              containerPort: 4100
          # Configuración y secretos propios del servicio; los crea el despliegue, nunca el repositorio
          envFrom:
            - configMapRef:
                name: saga-orchestrator-config
                optional: true
            - secretRef:
                name: saga-orchestrator-secretos
                optional: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "500m", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: saga-orchestrator
  labels:
    app.kubernetes.io/name: saga-orchestrator
    app.kubernetes.io/part-of: salon
spec:
  selector:
    app.kubernetes.io/name: saga-orchestrator
  ports:
    - name: http
      port: 4100
      targetPort: http
