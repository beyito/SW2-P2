# ====================================================================
# Esquema GraphQL para ms-crm (Clientes, Puntos, Facturas y Notas de Crédito)
# Las facturas y los puntos por compra no se crean desde aquí:
# los genera el evento saga.completed cuando un pago se confirma.
# ====================================================================

type Client {
    id: ID!
    fullName: String!
    email: String!
    phone: String!
    loyaltyPoints: Int!
    createdAt: String!
}

type LoyaltyTransaction {
    id: ID!
    points: Int!
    type: String!
    description: String!
    createdAt: String!
}

type Invoice {
    id: ID!
    invoiceNumber: Int
    appointmentId: String!
    clientId: String!
    clientName: String!
    serviceName: String
    subtotalAmount: Float!
    discountAmount: Float!
    totalAmount: Float!
    taxAmount: Float!
    paymentMethod: String!
    status: String!
    issuedAt: String!
}

type CreditNote {
    id: ID!
    creditNoteNumber: Int
    invoiceId: String!
    clientId: String!
    amount: Float!
    taxAmount: Float!
    reason: String!
    issuedAt: String
}

type Notice {
    id: ID!
    type: String!
    title: String!
    message: String!
    read: Boolean!
    createdAt: String
}

"Indicadores de facturación y fidelización de un periodo."
type CrmMetrics {
    "Lo cobrado menos lo reembolsado en el periodo."
    revenue: Float!
    refunded: Float!
    invoicesIssued: Int!
    payingClients: Int!
    totalClients: Int!
    pointsEarned: Int!
    pointsRedeemed: Int!
}

input RegisterClientInput {
    fullName: String!
    email: String!
    phone: String!
}

type Query {
    getClients: [Client!]! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getClients")
    getClientById(id: ID!): Client @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getClientById")
    getClientByEmail(email: String!): Client @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getClientByEmail")
    getMyProfile: Client @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getMyProfile")
    getClientPoints(clientId: String!): Int! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getClientPoints")
    getLoyaltyHistory(clientId: String!): [LoyaltyTransaction!]! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getLoyaltyHistory")
    getInvoiceById(id: ID!): Invoice @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getInvoiceById")
    getInvoicesByClient(clientId: String!): [Invoice!]! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getInvoicesByClient")
    getCreditNotesByClient(clientId: String!): [CreditNote!]! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getCreditNotesByClient")
    "Avisos del usuario autenticado y de sus roles, los más recientes primero."
    getMyNotices: [Notice!]! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getMyNotices")
    "Indicadores del periodo; solo para administradores. Fechas AAAA-MM-DD, ambas incluidas."
    getCrmMetrics(from: String!, to: String!): CrmMetrics! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@getCrmMetrics")
}

type Mutation {
    "Marca un aviso propio como leído."
    markNoticeRead(id: ID!): Boolean! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@markNoticeRead")
    "Registro de un cliente por el personal del salón (CU-03)."
    registerClient(input: RegisterClientInput!): Client! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@registerClient")
    "Crea o completa la ficha del usuario autenticado con los datos de su cuenta."
    syncMyProfile(phone: String): Client! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@syncMyProfile")
    "Ajuste manual de puntos; solo para administradores."
    accumulatePoints(clientId: String!, points: Int!, description: String!): Int! @field(resolver: "App\\InterfaceAdapters\\GraphQL\\CrmResolvers@accumulatePoints")
}
